<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Super Admin — ระบบติดตามนักเรียนแพทย์</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316466e'/%3E%3Ccircle cx='32' cy='24' r='9' fill='white'/%3E%3Cpath d='M15 52c2-10 9-15 17-15s15 5 17 15' fill='white'/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2733;--muted:#5d6b7a;--faint:#8a96a3;--line:#dde3ea;--soft:#eef2f6;--brand:#16466e;--brand2:#1f6aa5;--hl:#e8f1fb;
--s0:#1a7f5a;--s1:#d9dfe5;--s1ink:#1d2733;--s2:#b7791f;--s3:#c62828;--s4:#6a1b9a;--s5:#000;--s5line:#8a96a3;--err:#c62828;--ok:#1a7f5a;--warnbg:#fff3d6;--warnink:#6b4a00;--donebg:#f1f9f4;--curbg:#fff8e6;--curline:#e2b15e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121416;--card:#1a1c1e;--ink:#e6e8eb;--muted:#a3adb8;--faint:#7d8792;--line:#30353a;--soft:#24282c;
--brand:#0f2f4b;--brand2:#3b86c6;--hl:#1d2a38;--err:#ef7070;--ok:#4cc38a;--warnbg:#3d3010;--warnink:#ffd67a;--donebg:#16261d;--curbg:#2e2711;--curline:#a8823f}}
*{box-sizing:border-box}
body{margin:0;font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
html,body{overflow-x:hidden}
header{background:var(--brand);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:17px;margin:0}header .who{font-size:12px;opacity:.85;margin-top:2px;word-break:break-all}header a{color:#fff;font-size:13px;opacity:.85;white-space:nowrap}
main{max-width:1280px;margin:0 auto;padding:12px 16px 60px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.hidden{display:none!important}
.hint{font-size:13px;color:var(--muted)}
h2{font-size:16px;margin:0 0 10px}h3{font-size:15px;margin:0 0 8px}
button{font:inherit;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;color:inherit;background:var(--soft)}
button.pri{background:var(--brand2);color:#fff}button.danger{background:var(--s3);color:#fff}
button:disabled{opacity:.55;cursor:default}
button.sm{padding:4px 10px;font-size:13px}
select,input,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
textarea{width:100%;min-height:70px;resize:vertical}
nav.tabs{display:flex;gap:4px;margin:0 0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border-radius:8px 8px 0 0;padding:10px 14px;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs button[aria-selected=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--brand2)}
.sub{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0}
.sub button{font-size:14px;padding:6px 12px;border-radius:999px}
.sub button[aria-selected=true]{background:var(--brand2);color:#fff}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.search .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.search input[type=search]{flex:1;min-width:0}
.search select{flex:1;min-width:0}
.results{list-style:none;margin:0;padding:0;max-height:62vh;overflow:auto}
.results li button{display:block;width:100%;text-align:left;background:none;border-radius:8px;padding:8px 10px}
.results li button:hover,.results li button[aria-current=true]{background:var(--hl)}
.results b{display:block;font-weight:600}.results small{color:var(--muted)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.warn{background:var(--warnbg);color:var(--warnink)}
.st{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:2px 8px;border-radius:6px;color:#fff;white-space:nowrap}
.st.s-โดดเด่น{background:var(--s0)}.st.s-อยู่ในเกณฑ์,.st.s-ปกติ{background:var(--s1);color:var(--s1ink)}.st.s-ติดตาม{background:var(--s2)}.st.s-เฝ้าระวัง{background:var(--s3)}.st.s-ไม่จบรายวิชา{background:var(--s4)}.st.s-ไม่สามารถประเมินได้{background:var(--s5);box-shadow:inset 0 0 0 1px var(--s5line)}
.prof{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.prof h2{font-size:19px;margin:0}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:12px}
@media(max-width:900px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--soft);border-radius:8px;padding:8px 10px}.tile .n{font-size:22px;font-weight:700;line-height:1.2}.tile .q{font-size:12px;color:var(--muted)}.tile .u{font-size:12px;color:var(--muted);font-weight:400}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:720px}
td:first-child{white-space:nowrap}td button.sm{white-space:nowrap}
#app,main{min-width:0}section{min-width:0}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--soft);white-space:nowrap}
tr.repl td{color:var(--faint)}tr.repl .st{opacity:.5}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.cmt{max-width:420px;white-space:pre-wrap}
.empty{padding:22px;text-align:center;color:var(--muted)}
.nosrc{padding:16px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}
.cards{display:grid;gap:10px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card)}
.card .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
dl.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;white-space:pre-wrap}
@media(max-width:520px){dl.kv{grid-template-columns:1fr}dl.kv dt{margin-top:6px}}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.chart{position:relative}.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap;z-index:5}
.bar{display:flex;gap:2px;height:14px;min-width:120px}.bar span{display:block;height:100%}.bar span:first-child{border-radius:4px 0 0 4px}.bar span:last-child{border-radius:0 4px 4px 0}.bar span:only-child{border-radius:4px}
.meter{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;min-width:100px}.meter span{display:block;height:100%;background:var(--brand2);border-radius:999px}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;width:min(640px,96vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog .hd{padding:14px 16px;border-bottom:1px solid var(--line)}dialog .hd h2{margin:0}
dialog .bd{padding:14px 16px;max-height:68vh;overflow:auto}dialog .ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.fld{margin-bottom:12px}.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}.fld select,.fld input{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.ctx{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.msg{font-size:14px;margin-top:8px}.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:92vw}
.lockbox{max-width:420px;margin:10px auto;text-align:center;padding:20px;border:1px solid var(--line);border-radius:12px}
.lockbox input{width:180px;text-align:center;letter-spacing:4px;font-size:20px}
.secbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--warnbg);color:var(--warnink);padding:8px 12px;border-radius:8px;margin-bottom:10px;font-size:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.filters label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
#gbtn{min-height:44px;margin:12px 0}
.note{font-size:12px;color:var(--muted);margin-top:8px}
a.lnk{color:var(--brand2);cursor:pointer;text-decoration:underline}
/* รายบุคคล (ชุด ง) */
.pflag{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
label.fol{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;font-size:14px;cursor:pointer}
label.fol input{width:20px;height:20px;accent-color:var(--brand2)}label.fol.on{border-color:var(--brand2);color:var(--brand2);font-weight:600}
.ybar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.ptiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.ptiles .tile .n{font-size:26px}
.tile .s{font-size:12px;color:var(--muted);margin-top:4px}.tile .s.bad{color:var(--err);font-weight:600}.tile .s.warn{color:var(--s2)}
@media(max-width:700px){.ptiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pcmp tbody tr{cursor:pointer}.pcmp tbody tr.on td{background:var(--soft)}.pcmp tbody tr.on td:first-child{box-shadow:inset 3px 0 0 var(--brand2)}
.rbar{position:relative;height:10px;background:var(--soft);border-radius:4px}.rbar span{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.rbar i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}.rtxt{font-size:13px;margin-top:4px}
.good{color:var(--ok);font-size:13px}.bad{color:var(--err);font-size:13px}
.ptlin{min-width:640px}.pcmp .bar{min-width:100px}
.prow{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;margin-bottom:16px}.prow .pn{padding-top:26px}
.ptrk{display:flex;flex-direction:column;gap:4px}.pbody{position:relative}
.pseg{position:absolute;height:92px;display:flex;flex-direction:column;gap:3px;padding:0 1px;box-sizing:border-box;min-width:0}
.pst{height:64px;display:flex;flex-direction:column-reverse;gap:2px;padding:2px;box-sizing:border-box;border-radius:4px;background:var(--soft);overflow:hidden}
.pst i{display:block;flex:0 1 12px;min-height:3px;border-radius:2px}
.pseg .pl{font-size:12px;line-height:24px;padding:0 5px;border-radius:4px;background:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pseg.fut .pst{background:none;border:1px dashed var(--faint)}.pseg.fut .pl{background:none;color:var(--faint)}
.pseg.now .pst{outline:2px solid var(--brand2);outline-offset:-1px}.pseg.loose .pl{font-style:italic}.pseg.loose .pst{background:none;border:1px solid var(--s2)}
.pxcap{position:absolute;left:0;right:0;height:22px;line-height:22px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line)}
.pbody .today{position:absolute;top:0;bottom:0;width:2px;background:var(--brand2);pointer-events:none}
/* การมีส่วนร่วมของอาจารย์ */
.cbar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--soft);min-width:120px}.cbar span{display:block;height:100%}
.cbar .cd,.legend i.cd{background:var(--brand2)}.cbar .cn,.legend i.cn{background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 4px,var(--line) 4px,var(--line) 8px)}
.covtop{display:flex;gap:16px;align-items:center;margin-bottom:6px}.covtop .big{font-size:40px;font-weight:700;color:var(--brand2);line-height:1}.covtop .grow{flex:1}
.covlist,.pplist{display:grid;gap:8px;margin-top:10px}
.covrow,.pprow{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr) 170px;gap:10px;align-items:center}
.covrow .cv,.pprow .pv{font-size:13px;text-align:right}.pprow .bar{height:16px}.pprow.all{padding-bottom:8px;border-bottom:1px solid var(--line)}
@media(max-width:600px){.covrow,.pprow{grid-template-columns:1fr 90px}.covrow .cl,.pprow .pl{grid-column:1/-1}}
/* ภาพรวมชั้นปี */
.ovtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.ovtiles .tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}.ovtiles .tile .n{font-size:30px}.ovtiles .tile .q{font-size:14px}
.ovtiles .tile.hi{border-color:var(--brand2)}.ovtiles .tile.hi .n{color:var(--brand2)}
.ovhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}.ovhead h3{margin:0}
.seg2{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.seg2 button{min-height:38px;border:1px solid var(--line);background:transparent}
.seg2 button[aria-pressed=true]{background:var(--brand2);border-color:var(--brand2);color:#fff}
.ovfilt{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.ovfilt .ft{width:100%;font-weight:600;font-size:14px}.ovfilt label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}.ovfilt label.grow{flex:1 1 220px}
.ovfilt input,.ovfilt select{min-height:38px}
.ovt td{vertical-align:middle}.ovt input.tick{width:22px;height:22px;accent-color:var(--brand2)}
.ovt input[type=date],.ovt input[type=text]{font-size:14px;padding:6px 8px;max-width:160px}.ovt input.saved{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ovt input[type=date]{color-scheme:dark}}
.ovt td.nm{min-width:190px;white-space:normal}.ncell{max-width:240px}.nl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.lnkbtn{background:none;border:1px solid var(--line);color:var(--brand2);margin-top:4px}
i.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.bar.empty{border:1px dashed var(--faint);border-radius:4px}
.gp{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap;margin:1px 0}.gp.done{background:var(--soft);color:var(--muted);border:1px solid var(--line)}.gp.now{background:var(--brand2);color:#fff}
.rotwrap{overflow-x:auto}.rotin{min-width:900px}
.rr{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:start;margin-bottom:10px}.rr .rn{font-weight:600;font-size:14px;padding-top:28px}.rr.sub .rn{font-weight:400;padding-left:12px}
.rr.axis{margin-bottom:4px}.rr.axis .rn{padding:0}.rt{position:relative}.rt.ax{height:20px;border-bottom:1px solid var(--line)}
.mk{position:absolute;top:0;font-size:12px;color:var(--muted);border-left:1px solid var(--line);padding-left:4px;white-space:nowrap;height:20px}
.sg{position:absolute;height:82px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:0 1px;box-sizing:border-box;min-width:0}
.sg .tt{font-size:11px;color:var(--muted);height:18px;line-height:18px;white-space:nowrap;overflow:hidden}
.sg .sb{height:46px;display:flex;flex-direction:column-reverse;gap:1px;border-radius:4px;overflow:hidden;background:var(--soft)}.sg .sb i{display:block;min-height:2px}
.sg .sl{font-size:12px;line-height:20px;padding:0 4px;border-radius:4px;background:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg.fut .sb{background:none;border:1px dashed var(--faint)}.sg.fut .sl{background:none;border:1px dashed var(--faint);color:var(--faint)}
.sg.now .sb{outline:2px solid var(--brand2);outline-offset:1px}
.sg.emp .sb,.pseg.emp .pst,.legend i.emp{background:repeating-linear-gradient(45deg,var(--card),var(--card) 5px,var(--line) 5px,var(--line) 7px);box-shadow:inset 0 0 0 1px var(--line)}
.rbody{position:relative}.tline{position:absolute;top:0;bottom:0;left:106px;right:0;pointer-events:none}.today{position:absolute;top:0;bottom:0;width:2px;background:var(--brand2)}
.nlist{display:grid;gap:8px;max-height:40vh;overflow:auto;margin-bottom:12px}
@media(max-width:600px){.ovtiles{grid-template-columns:1fr}}
/* โหมดประชุม / เตรียม-ปิดรอบ */
.cbtns{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.mm-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.mm-id{font-size:20px;font-weight:700;word-break:break-all}
.mm-prog{flex:1;min-width:220px}.mm-track{height:10px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:6px}.mm-track i{display:block;height:100%;background:var(--ok)}
.mm-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:14px 0 10px}.mm-tools input[type=search]{flex:1 1 200px;min-width:0;min-height:36px}
.chip{border-radius:999px;padding:6px 12px;font-size:13px;background:var(--soft)}.chip[aria-pressed=true]{background:var(--brand2);color:#fff}
table.mm{min-width:1200px;table-layout:fixed}table.mm th{white-space:normal}table.mm td{white-space:normal;overflow-wrap:anywhere}
table.mm input:not([type=checkbox]),table.mm textarea{width:100%;font-size:13px;padding:6px 8px}table.mm textarea{min-height:52px;margin-top:6px}
table.mm .gap{margin-top:6px}table.mm input.saved,table.mm textarea.saved{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
tr.mm-done td{background:var(--donebg)}tr.mm-cur td{background:var(--curbg)}tr.mm-cur td:first-child{box-shadow:inset 3px 0 0 var(--curline)}
.mm-pills{display:flex;gap:4px}.mm-n{min-width:26px;text-align:center;color:#fff;border-radius:6px;padding:2px 6px;font-weight:700;font-size:13px}.mm-n.z{background:var(--soft);color:var(--faint)}
.mm-esc{margin-top:6px;font-size:12px;font-weight:700;color:var(--err)}.mm-ok{color:var(--ok);font-size:13px;font-weight:600}.mm-busy{color:var(--warnink);font-size:13px;font-weight:600}.mm-bad{color:var(--err);font-size:13px;font-weight:600}
label.ck{display:flex;gap:6px;align-items:center;font-size:13px;margin-top:8px;cursor:pointer}label.ck input{width:18px;height:18px;flex:none;margin:0;accent-color:var(--brand2)}label.ck.on{color:var(--ok);font-weight:600}
.pbar{display:flex;height:10px;border-radius:3px;overflow:hidden;margin-top:6px;background:var(--soft)}.pbar i{display:block;height:100%}
details.cm summary{cursor:pointer;color:var(--brand2);font-size:13px;margin-top:6px}details.cm div{white-space:pre-wrap;font-size:13px;max-height:220px;overflow:auto;margin-top:4px}
.idbox{background:var(--hl);border-radius:8px;padding:12px}.idbox .code{font-size:22px;font-weight:700;color:var(--brand2);word-break:break-all}
.warnbox{background:var(--warnbg);color:var(--warnink);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.escbox{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px}.escbox b{color:var(--err)}
#printArea{display:none}
@media print{
  body.printing>*:not(#printArea){display:none!important}body.printing #printArea{display:block}
  body.printing{background:#fff;color:#000;font-size:11pt}

/* ---------- เข้าสู่ระบบ ---------- */

/* ---------- รายบุคคล ---------- */
function openStudent(id, keepSub){
  if (id !== CUR) psyLock();
  if (id !== CUR && !keepSub) SELAY = null;   /* นักเรียนใหม่ -> เริ่มที่ปีการศึกษาปัจจุบัน */

    if (window.innerWidth < 900) $('person').scrollIntoView({behavior:'smooth'}); })

function counts(list){ var c = {}; STAT.forEach(function(s){ c[s]=0; }); list.forEach(function(e){ var k = norm(e.status); if (c[k]!=null) c[k]++; }); return c; }
/* ชุด ง: รายบุคคลแบบรวม — เลือกปีการศึกษา · ช่องสรุป 4 ช่อง · เทียบรายปี · ไทม์ไลน์แยกภาควิชาตามช่วงเวลาจริง */
var SELAY = null;   /* ปีการศึกษาที่เลือก · 'all' = ทุกปี · null = ปีปัจจุบัน */
function evAY(e){ return e.ay || (e.week_start ? acadYear(e.week_start) : ''); }
function pYears(){
  var cur = acadYear(B.today || INIT.today), Y = {};

  B.evals.forEach(function(e){ if (e.replaced || !e.week_start) return; var y = get(evAY(e)); y.ev.push(e); if (e.year_level) y.lv[e.year_level] = (y.lv[e.year_level]||0) + 1; });
  B.rotation.forEach(function(r){ if (r.start) get(acadYear(r.start)).rot.push(r); });
  (B.affective||[]).forEach(function(a){ var k = String(a.acad_year||''); if (!/^25\d\d$/.test(k)) return; var y = get(k); y.af = a; if (a.year_level) y.afl = String(a.year_level); });
  return Object.keys(Y).sort().reverse().map(function(k){
    var y = Y[k], pr = (B.peers||{})[k];
    var lv = Object.keys(y.lv).sort(function(a,b){ return y.lv[b] - y.lv[a]; })[0] || (pr && pr.level) || y.afl || (k === cur ? B.profile.year : '');
    var c = counts(y.ev), n = rated(y.ev).length, con = c['ติดตาม']+c['เฝ้าระวัง']+c['ไม่จบรายวิชา'], dp = {};
    y.ev.forEach(function(e){ if (CONCERN[e.status]) dp[e.department] = 1; });
    var rv = (B.reviews||[]).filter(function(r){ return r.period && r.period[1] && acadYear(r.period[1]) === k; })[0];
    return { ay:k, level:lv, cur:k === cur, ev:y.ev, rot:y.rot, c:c, n:n, con:con, rate: n ? con/n : null, depts:Object.keys(dp), af:y.af, rev:rv,

  var nd = Object.keys(cd).length, rate = nr ? con/nr : null;
  var afx = sel ? sel.af : (B.affective||[]).slice().sort(function(a,b){ return a.acad_year < b.acad_year ? 1 : -1; })[0];

  var tiles = [
    [ev.length, 'ครั้ง', 'ผลประเมิน '+(sel ? 'ปีการศึกษา '+sel.ay : 'ทุกปี'), c[NA] ? c[NA]+' ครั้งเป็น "ไม่สามารถประเมินได้" (ไม่นับในอัตรา)' : '', ''],

  ];

  var rv = (B.reviews||[])[0], fol = B.follow, on = !!(fol && fol.active);

  $('pId').textContent = nid ? nid + (PREP.ex ? '  (เดิม '+PREP.ex.id+')' : '') : '— ใส่วันประชุม —';
}
function prepSave(){
  var q = { year:$('pYear').value, round:$('pRound').value, start:$('pStart').value, end:$('pEnd').value, meeting:$('pMeet').value, reqId: rid() };
  if (!q.start || !q.end) return Promise.reject(new Error('กรุณาระบุช่วงข้อมูล'));
  if (q.start > q.end) return Promise.reject(new Error('วันเริ่มต้องไม่หลังวันสิ้นสุด'));
  if (!q.meeting && !PREP.ex) return Promise.reject(new Error('กรุณาระบุวันประชุม (ใช้สร้างรหัสรอบ)'));
  $('d2Save').textContent = 'กำลังเตรียมข้อมูล...';
  return api('adm_round_prepare', q).then(function(r){
    toast('เตรียมข้อมูลรอบ '+r.id+' แล้ว'); MEET.msg = r.message; LOADED.cohort = false;
    if ($('cYear').querySelector('option[value="'+q.year+'"]')) $('cYear').value = q.year;

        '<div class="covlist">'+d.depts.map(function(x){ return '<div class="covrow"><div class="cl">'+esc(short(x.dept))+'</div>'+covBar(x.done, x.due)+'<div class="cv">'+x.done+'/'+x.due+' <b>'+(x.pct==null?'—':Math.round(x.pct)+'%')+'</b>'+(x.records&&x.na?'<div class="hint">ประเมินไม่ได้ '+x.na+'/'+x.records+' บันทึก</div>':'')+'</div></div>'; }).join('')+'</div>'
       : '<div class="nosrc">ยังไม่มีฐานคำนวณในช่วงนี้ (ไม่มี rotation ที่สิ้นสุดแล้วในตารางหมุนเวียน) จึงไม่แสดงเปอร์เซ็นต์</div>')+
      '<div class="note">ฐาน = นักเรียน 1 คน × 1 rotation ที่สิ้นสุดแล้วในช่วงที่เลือก (คน-rotation) · นับว่าประเมินแล้วเมื่อมีผลจากภาควิชานั้นระหว่าง rotation ถึง 2 สัปดาห์หลังสิ้นสุด (รวม "ไม่สามารถประเมินได้") · ตารางหมุนเวียนผูกกับภาควิชา จึงแสดงได้ถึงระดับภาควิชา ไม่แยกรายอาจารย์ · เรียงจากส่งน้อยไปมาก</div></div>'+
    '<div class="panel"><div class="ovhead"><h3>สัดส่วนระดับผลประเมินที่ให้</h3>'+
      (afList.length > 1 || TAF ? '<label class="hint">สังกัด (ที่เลือกตอนส่ง) <select id="tAf"><option value="">ทุกสังกัด</option>'+afList.map(function(a){ var v = a || '-'; return '<option value="'+esc(v)+'"'+(TAF===v?' selected':'')+'>'+(a?esc(short(a)):'ไม่ระบุสังกัด')+'</option>'; }).join('')+'</select></label>' : '')+'</div>'+
      '<div class="legend">'+STAT.map(function(s){ return '<span><i style="'+sw(s)+'"></i>'+s+'</span>'; }).join('')+'</div>'+
      (ts.length ? '<div class="pplist"><div class="pprow all"><div class="pl"><b>ทุกคนรวมกัน</b><div class="hint">'+ts.length+' คน · '+nRec+' บันทึก</div></div>'+sbar(allC)+'<div class="pv">'+pctCon(allC)+'</div></div>'+
        ts.map(function(t){ var c = cFull(t.c); return '<div class="pprow"><div class="pl">'+tname(t)+'<div class="hint">'+afLab(t)+' · '+t.records+' บันทึก</div></div>'+sbar(c)+'<div class="pv">'+pctCon(c)+'</div></div>'; }).join('')+'</div>'
       : '<div class="hint">ไม่มีการส่งในช่วงนี้</div>')+
      '<div class="note">1 แถบ = ผลประเมินทั้งหมดที่อาจารย์คนนั้นให้ในช่วงที่เลือก แบ่งสีตามระดับ · ตัวเลขขวา = ข้อกังวล (ติดตาม + เฝ้าระวัง + ไม่จบรายวิชา) ÷ ผลที่ประเมินได้ · สังกัด = ที่อาจารย์เลือกตอนส่งครั้งล่าสุดในช่วงนี้</div></div>'+
    '<div class="panel"><h3>การส่งรายอาจารย์ ('+ts.length+' คน)</h3>'+(ts.length ? '<div class="tablewrap"><table><thead><tr><th>อาจารย์</th><th>สังกัด</th><th>ภาควิชาที่ส่ง</th><th class="num">ครั้งที่ส่ง</th><th class="num">บันทึก</th><th class="num">นักเรียน (คน)</th><th class="num">ข้อกังวล (บันทึก)</th><th class="num">ไม่สามารถประเมินได้</th><th>ส่งล่าสุด</th></tr></thead><tbody>'+
      ts.map(function(t){ return '<tr><td>'+(t.name?esc(t.name)+'<div class="hint">'+esc(t.email)+'</div>':esc(t.email))+'</td><td>'+afLab(t)+'</td><td>'+t.depts.map(function(x){ return esc(short(x)); }).join(', ')+'</td>'+
        '<td class="num">'+t.submissions+'</td><td class="num">'+t.records+'</td><td class="num">'+t.students+'</td><td class="num">'+t.concerns+'</td><td class="num">'+(t.na||'<span class="hint">0</span>')+'</td><td>'+thd(t.last)+'</td></tr>'; }).join('')+'</tbody></table></div>' : '<div class="hint">ไม่มีการส่งในช่วงนี้</div>')+
      '<div class="note">ครั้งที่ส่ง = ภาควิชา × สัปดาห์ · บันทึก = ผลประเมินรายคน (ไม่นับที่แทนที่แล้ว) · นักเรียน = จำนวนคนไม่ซ้ำ</div></div>';
  if ($('tAf')) $('tAf').onchange = function(){ TAF = this.value; renderTeach(); };
}
function pctCon(c){ var n = 0, k = 0; STAT.forEach(function(s){ if (s !== NA) n += c[s]; }); k = c['ติดตาม'] + c['เฝ้าระวัง'] + c['ไม่จบรายวิชา'];
  return n ? 'ข้อกังวล '+Math.round(k*100/n)+'%' : '<span class="hint">—</span>'; }
/* ---------- ตั้งค่า (เฉพาะ psypcm) ---------- */
var STAFF_CONFIRM = '';
function loadSettings(){
  $('setBody').innerHTML = '<div class="panel empty">กำลังโหลด...</div>';
  api('adm_settings').then(renderSettings).catch(function(e){ if (relogin(e, loadSettings)) return; $('setBody').innerHTML = '<div class="panel empty">'+esc(e.message)+'</div>'; });
}
function renderSettings(d){
  INIT.pinSet = d.pinSet;
  var psy = d.psych.map(function(r){ var sh = r.editors.concat(r.viewers);
    return '<tr><td><a class="lnk" href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.name)+'</a></td><td>'+(r.ok ? '<span class="pill">✓ เจ้าของคนเดียว ไม่ได้แชร์</span>' :
      '<span class="pill warn">⚠ แชร์อยู่: '+esc(sh.join(', ')+(r.link!=='PRIVATE'?' · ลิงก์ '+r.link:''))+'</span>')+'</td></tr>'; }).join('');
  var staff = d.staff.length ? '<div class="tablewrap"><table><thead><tr><th>อีเมล</th><th>สิทธิ์ใน DB_MAIN</th><th>ใช้เมนูได้</th><th>ไฟล์จิตเวช</th><th></th></tr></thead><tbody>'+
    d.staff.map(function(x){ return '<tr><td>'+esc(x.email)+'</td><td>'+esc(x.role)+'</td><td>'+(x.core?'✓':'<span class="pill warn">ยังไม่ได้ — กดเพิ่มซ้ำ</span>')+'</td><td>'+(x.psych?'<span class="pill warn">⚠ มีสิทธิ์ — กดเพิ่มซ้ำเพื่อถอน</span>':'ไม่มีสิทธิ์ ✓')+'</td>'+
      '<td><button class="sm '+(STAFF_CONFIRM===x.email?'danger':'')+'" data-rm="'+esc(x.email)+'">'+(STAFF_CONFIRM===x.email?'ยืนยันถอนสิทธิ์':'ถอนสิทธิ์')+'</button></td></tr>'; }).join('')+'</tbody></table></div>'
    : '<div class="hint">ยังไม่มีแอดมินเจ้าหน้าที่</div>';
  $('setBody').innerHTML =
    '<div class="panel"><h3>แอดมินเจ้าหน้าที่ (แก้ไข DB_MAIN ได้ ยกเว้นข้อมูลจิตเวช)</h3>'+staff+
      '<form id="staffForm" class="filters" style="margin-top:12px"><input type="email" id="staffEmail" placeholder="อีเมลบัญชี Google ของเจ้าหน้าที่" style="flex:1;min-width:220px" required> <button class="pri" id="staffAdd">เพิ่มแอดมินเจ้าหน้าที่</button></form>'+
      '<div class="msg" id="staffMsg" role="status"></div>'+
      '<div class="note">เพิ่มแล้ว: เจ้าหน้าที่แก้ไข DB_MAIN และใช้เมนู "ระบบติดตาม" ได้ · Google จะส่งอีเมลแจ้งการแชร์ให้เจ้าหน้าที่ · ไม่ได้รับสิทธิ์ไฟล์จิตเวช (ถ้ามีค้างอยู่ระบบถอนให้) · ไม่ได้ใช้หน้าเว็บนี้ · แท็บ _Log และ _ประวัติแก้ไขผ่านเว็บ ล็อกให้ระบบเขียนเท่านั้น</div></div>'+
    '<div class="panel"><h3>PIN ส่วนข้อมูลลับ</h3><p class="hint" style="margin-top:0">สถานะ: '+(d.pinSet?'<b>ตั้งแล้ว</b>':'<b style="color:var(--err)">ยังไม่ได้ตั้ง</b>')+' · ตัวเลข 6–12 หลัก ระบบเก็บเฉพาะค่าแฮช</p>'+
      '<form id="pinSetForm" class="grid2" autocomplete="off">'+(d.pinSet?fld('pinCur','PIN เดิม','<input type="password" id="pinCur" inputmode="numeric" maxlength="12" autocomplete="off">'):'')+
      fld('pinNew','PIN ใหม่','<input type="password" id="pinNew" inputmode="numeric" maxlength="12" autocomplete="new-password">')+fld('pinNew2','ยืนยัน PIN ใหม่','<input type="password" id="pinNew2" inputmode="numeric" maxlength="12" autocomplete="new-password">')+
      '<div><button class="pri" id="pinSave">'+(d.pinSet?'เปลี่ยน PIN':'ตั้ง PIN')+'</button></div></form><div class="msg" id="pinSetMsg" role="status"></div></div>'+
    '<div class="panel"><h3>ไฟล์ข้อมูลจิตเวช (ต้องมีแค่ '+esc(d.owner)+')</h3><div class="tablewrap"><table><tbody>'+psy+'</tbody></table></div>'+
      '<div class="note">DB_MAIN: <a class="lnk" href="'+esc(d.mainUrl)+'" target="_blank" rel="noopener">เปิดไฟล์</a> · การแชร์ลิงก์ '+esc(d.mainLink)+'</div></div>';
  [].forEach.call(document.querySelectorAll('[data-rm]'), function(b){ b.onclick = function(){
    var em = b.dataset.rm; if (STAFF_CONFIRM !== em){ STAFF_CONFIRM = em; renderSettings(d); return; }
    STAFF_CONFIRM = ''; b.disabled = true; staffCall('adm_staff_remove', em); }; });
  $('staffForm').onsubmit = function(e){ e.preventDefault(); var em = $('staffEmail').value.trim();
    if (!/^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(em)){ $('staffMsg').className='msg err'; $('staffMsg').textContent = 'อีเมลไม่ถูกต้อง'; return; }
    $('staffAdd').disabled = true; staffCall('adm_staff_add', em); };
  $('pinSetForm').onsubmit = function(e){ e.preventDefault(); var a = $('pinNew').value.trim(), b = $('pinNew2').value.trim(), c = $('pinCur') ? $('pinCur').value.trim() : '', m = $('pinSetMsg');
    m.className = 'msg err';
    if (!/^\d{6,12}$/.test(a)){ m.textContent = 'PIN ต้องเป็นตัวเลข 6–12 หลัก'; return; }
    if (a !== b){ m.textContent = 'PIN ใหม่สองช่องไม่ตรงกัน'; return; }
    $('pinSave').disabled = true; m.className = 'msg'; m.textContent = 'กำลังบันทึก...';
    [].forEach.call(document.querySelectorAll('#pinSetForm input'), function(x){ x.value = ''; });
    api('psy_setpin', { pin: c, newPin: a }).then(function(r){ INIT.pinSet = true; toast(r.message); loadSettings(); })
      .catch(function(err){ if (relogin(err, loadSettings)) return; $('pinSave').disabled = false; m.className = 'msg err'; m.textContent = err.message; }); };
}
function staffCall(action, email){
  $('staffMsg').className = 'msg'; $('staffMsg').textContent = 'กำลังดำเนินการ...';
  api(action, { email: email }).then(function(d){ toast(d.message); renderSettings(d); })
    .catch(function(e){ if (relogin(e, loadSettings)) return; $('staffMsg').className = 'msg err'; $('staffMsg').textContent = e.message; if ($('staffAdd')) $('staffAdd').disabled = false; });
}
</script>
<script src="https://accounts.google.com/gsi/client" async></script>
