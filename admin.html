<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Super Admin — ระบบติดตามนักเรียนแพทย์</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316466e'/%3E%3Ccircle cx='32' cy='24' r='9' fill='white'/%3E%3Cpath d='M15 52c2-10 9-15 17-15s15 5 17 15' fill='white'/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2733;--muted:#5d6b7a;--faint:#8a96a3;--line:#dde3ea;--soft:#eef2f6;--brand:#16466e;--brand2:#1f6aa5;--hl:#e8f1fb;
--s0:#1a7f5a;--s1:#5d6b7a;--s2:#b7791f;--s3:#c62828;--s4:#6a1b9a;--err:#c62828;--ok:#1a7f5a;--warnbg:#fff3d6;--warnink:#6b4a00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121416;--card:#1a1c1e;--ink:#e6e8eb;--muted:#a3adb8;--faint:#7d8792;--line:#30353a;--soft:#24282c;
--brand:#0f2f4b;--brand2:#3b86c6;--hl:#1d2a38;--err:#ef7070;--ok:#4cc38a;--warnbg:#3d3010;--warnink:#ffd67a}}
*{box-sizing:border-box}
body{margin:0;font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
html,body{overflow-x:hidden}
header{background:var(--brand);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:17px;margin:0}header .who{font-size:12px;opacity:.85;margin-top:2px;word-break:break-all}header a{color:#fff;font-size:13px;opacity:.85;white-space:nowrap}
main{max-width:1280px;margin:0 auto;padding:12px 16px 60px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.hidden{display:none!important}
.hint{font-size:13px;color:var(--muted)}
h2{font-size:16px;margin:0 0 10px}h3{font-size:15px;margin:0 0 8px}
button{font:inherit;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;color:inherit;background:var(--soft)}
button.pri{background:var(--brand2);color:#fff}button.danger{background:var(--s3);color:#fff}
button:disabled{opacity:.55;cursor:default}
button.sm{padding:4px 10px;font-size:13px}
select,input,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
textarea{width:100%;min-height:70px;resize:vertical}
nav.tabs{display:flex;gap:4px;margin:0 0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border-radius:8px 8px 0 0;padding:10px 14px;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs button[aria-selected=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--brand2)}
.sub{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0}
.sub button{font-size:14px;padding:6px 12px;border-radius:999px}
.sub button[aria-selected=true]{background:var(--brand2);color:#fff}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.search .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.search input[type=search]{flex:1;min-width:0}
.search select{flex:1;min-width:0}
.results{list-style:none;margin:0;padding:0;max-height:62vh;overflow:auto}
.results li button{display:block;width:100%;text-align:left;background:none;border-radius:8px;padding:8px 10px}
.results li button:hover,.results li button[aria-current=true]{background:var(--hl)}
.results b{display:block;font-weight:600}.results small{color:var(--muted)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.warn{background:var(--warnbg);color:var(--warnink)}
.st{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:2px 8px;border-radius:6px;color:#fff;white-space:nowrap}
.st.s-โดดเด่น{background:var(--s0)}.st.s-ปกติ{background:var(--s1)}.st.s-ติดตาม{background:var(--s2)}.st.s-เฝ้าระวัง{background:var(--s3)}.st.s-ไม่จบรายวิชา{background:var(--s4)}
.prof{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.prof h2{font-size:19px;margin:0}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:12px}
@media(max-width:900px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--soft);border-radius:8px;padding:8px 10px}.tile .n{font-size:22px;font-weight:700;line-height:1.2}.tile .q{font-size:12px;color:var(--muted)}.tile .u{font-size:12px;color:var(--muted);font-weight:400}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:720px}
td:first-child{white-space:nowrap}td button.sm{white-space:nowrap}
#app,main{min-width:0}section{min-width:0}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--soft);white-space:nowrap}
tr.repl td{color:var(--faint)}tr.repl .st{opacity:.5}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.cmt{max-width:420px;white-space:pre-wrap}
.empty{padding:22px;text-align:center;color:var(--muted)}
.nosrc{padding:16px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}
.cards{display:grid;gap:10px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card)}
.card .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
dl.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;white-space:pre-wrap}
@media(max-width:520px){dl.kv{grid-template-columns:1fr}dl.kv dt{margin-top:6px}}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.chart{position:relative}.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap;z-index:5}
.bar{display:flex;gap:2px;height:14px;min-width:120px}.bar span{display:block;height:100%}.bar span:first-child{border-radius:4px 0 0 4px}.bar span:last-child{border-radius:0 4px 4px 0}.bar span:only-child{border-radius:4px}
.meter{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;min-width:100px}.meter span{display:block;height:100%;background:var(--brand2);border-radius:999px}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;width:min(640px,96vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog .hd{padding:14px 16px;border-bottom:1px solid var(--line)}dialog .hd h2{margin:0}
dialog .bd{padding:14px 16px;max-height:68vh;overflow:auto}dialog .ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.fld{margin-bottom:12px}.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}.fld select,.fld input{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.ctx{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.msg{font-size:14px;margin-top:8px}.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:92vw}
.lockbox{max-width:420px;margin:10px auto;text-align:center;padding:20px;border:1px solid var(--line);border-radius:12px}
.lockbox input{width:180px;text-align:center;letter-spacing:4px;font-size:20px}
.secbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--warnbg);color:var(--warnink);padding:8px 12px;border-radius:8px;margin-bottom:10px;font-size:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.filters label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
#gbtn{min-height:44px;margin:12px 0}
.note{font-size:12px;color:var(--muted);margin-top:8px}
a.lnk{color:var(--brand2);cursor:pointer;text-decoration:underline}
</style></head>
<body>
<header><div><h1>ผู้ดูแลระบบสูงสุด · ระบบติดตามนักเรียนแพทย์</h1><div class="who" id="who"></div></div><a href="#" id="signout" class="hidden">ออกจากระบบ</a></header>
<main>
<div id="login" class="panel hidden">
  <p style="margin-top:0">หน้านี้สำหรับผู้ดูแลระบบสูงสุดเท่านั้น เข้าสู่ระบบด้วยบัญชี Google ของผู้ดูแล</p>
  <div id="gbtn"></div><div id="loginMsg" class="hint"></div>
</div>
<div id="app" class="hidden">
  <nav class="tabs" role="tablist">
    <button role="tab" data-v="person" aria-selected="true">รายบุคคล</button>
    <button role="tab" data-v="cohort" aria-selected="false">ภาพรวมชั้นปี</button>
    <button role="tab" data-v="teach" aria-selected="false">การมีส่วนร่วมของอาจารย์</button>
  </nav>

  <section id="v-person" class="layout">
    <div class="panel search">
      <h2>ค้นหานักเรียน</h2>
      <div class="row"><input type="search" id="q" placeholder="รหัส หรือ ชื่อ–นามสกุล" aria-label="ค้นหารหัสหรือชื่อ" autocomplete="off"></div>
      <div class="row">
        <select id="fStatus" aria-label="สถานะการศึกษา"><option value="">ทุกสถานะ</option></select>
        <select id="fYear" aria-label="ชั้นปี"><option value="">ทุกชั้นปี</option></select>
      </div>
      <div class="hint" id="resCount"></div>
      <ul class="results" id="results"></ul>
    </div>
    <div id="person">
      <div class="panel empty" id="personEmpty">เลือกนักเรียนจากผลค้นหาทางซ้ายเพื่อเปิดประวัติ</div>
      <div id="personBody" class="hidden"></div>
    </div>
  </section>

  <section id="v-cohort" class="hidden">
    <div class="filters"><label>ชั้นปี <select id="cYear"></select></label><span class="hint" id="cNote"></span></div>
    <div id="cohortBody"><div class="panel empty">กำลังโหลด...</div></div>
  </section>

  <section id="v-teach" class="hidden">
    <div class="filters">
      <label>ตั้งแต่ <input type="date" id="tFrom"></label><label>ถึง <input type="date" id="tTo"></label>
      <button class="pri sm" id="tGo">แสดงผล</button>
    </div>
    <div id="teachBody"><div class="panel empty">กำลังโหลด...</div></div>
  </section>
</div>
</main>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form method="dialog" id="dlgForm" novalidate>
    <div class="hd"><h2 id="dlgTitle"></h2></div>
    <div class="bd" id="dlgBody"></div>
    <div class="ft"><button type="button" id="dlgCancel">ยกเลิก</button><button type="submit" class="pri" id="dlgSave">บันทึก</button></div>
  </form>
</dialog>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>

<script>
var CONFIG = {
  CLIENT_ID: '731005120812-6qqtlt9a6sudckuuk8u2jpg13idm48ml.apps.googleusercontent.com',
  API: 'https://script.google.com/macros/s/AKfycbymoO1Kn9Hr53CLhyyEBKtPe38WB0OBqwYRWqH7GLsvUCWec26g3za3B3ww8gDiF_C6/exec'
};
var STAT = ['โดดเด่น','ปกติ','ติดตาม','เฝ้าระวัง','ไม่จบรายวิชา'], ICON = {'โดดเด่น':'★','ปกติ':'','ติดตาม':'●','เฝ้าระวัง':'▲','ไม่จบรายวิชา':'■'};
var COLOR = {'โดดเด่น':'var(--s0)','ปกติ':'var(--s1)','ติดตาม':'var(--s2)','เฝ้าระวัง':'var(--s3)','ไม่จบรายวิชา':'var(--s4)'}, CONCERN = {'ติดตาม':1,'เฝ้าระวัง':1,'ไม่จบรายวิชา':1};
var $ = function(id){ return document.getElementById(id); };
var idToken = '', INIT = null, B = null, CUR = '', SUB = 'eval', SHOWREPL = false, pending = null;
var PSY = { token:'', sid:'', timer:null, last:0, data:null };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
var TH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thd(s){ s=String(s||''); if(!/^\d{4}-\d{2}-\d{2}/.test(s)) return esc(s); var p=s.slice(0,10).split('-'); return (+p[2])+' '+TH[+p[1]-1]+' '+String(+p[0]+543).slice(2)+(s.length>10?' '+s.slice(11,16):''); }
function thm(ym){ var p=ym.split('-'); return TH[+p[1]-1]+' '+String(+p[0]+543).slice(2); }
function short(d){ return String(d||'').replace(/^ภาควิชา/,''); }
function stat(s){ return s ? '<span class="st s-'+esc(s)+'">'+(ICON[s]?ICON[s]+' ':'')+esc(s)+'</span>' : '<span class="hint">—</span>'; }
function dash(v){ return v===''||v==null ? '<span class="hint">—</span>' : esc(v); }
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.remove('hidden'); clearTimeout(toast.h); toast.h=setTimeout(function(){ t.classList.add('hidden'); }, 5000); }
function rid(){ var a=new Uint8Array(12); crypto.getRandomValues(a); return Array.prototype.map.call(a,function(b){return ('0'+b.toString(16)).slice(-2);}).join(''); }
function acadYear(s){ var y=+s.slice(0,4), m=+s.slice(5,7); return String(y+543-(m<4?1:0)); }

/* ---------- เข้าสู่ระบบ ---------- */
function onCred(r){ idToken = r.credential; if (pending){ var p=pending; pending=null; p(); } else start(); }
window.onGoogleLibraryLoad = function(){
  google.accounts.id.initialize({ client_id: CONFIG.CLIENT_ID, callback: onCred, auto_select: true, use_fedcm_for_prompt: true, itp_support: true });
  google.accounts.id.renderButton($('gbtn'), { theme:'filled_blue', size:'large', text:'signin_with', shape:'pill', locale:'th', width:280 });
  $('login').classList.remove('hidden'); google.accounts.id.prompt();
};
$('signout').onclick = function(e){ e.preventDefault(); psyLock(true); try{ google.accounts.id.disableAutoSelect(); }catch(_){} location.reload(); };
function api(action, data){
  return fetch(CONFIG.API, { method:'POST', body: JSON.stringify(Object.assign({ action: action, idToken: idToken }, data||{})) })
    .then(function(r){ return r.json(); }, function(){ throw new Error('เชื่อมต่อไม่ได้ กรุณาตรวจอินเทอร์เน็ต'); })
    .then(function(r){ if (r.ok) return r.data; var e = new Error(r.error||'เกิดข้อผิดพลาด'); e.code = r.code; throw e; });
}
function relogin(e, retry){
  if (e && e.code === 'AUTH'){ idToken=''; pending = retry; $('login').classList.remove('hidden'); $('loginMsg').textContent = e.message; try{ google.accounts.id.prompt(); }catch(_){} return true; }
  return false;
}
function start(){
  $('loginMsg').textContent = 'กำลังตรวจสิทธิ์...';
  api('adm_init').then(function(d){
    INIT = d; $('login').classList.add('hidden'); $('app').classList.remove('hidden'); $('signout').classList.remove('hidden');
    $('who').textContent = d.email + ' · ข้อมูล ณ ' + thd(d.today);
    $('fStatus').innerHTML = '<option value="">ทุกสถานะ</option>' + d.statuses.map(function(s){ return '<option'+(s==='กำลังศึกษา'?' selected':'')+'>'+esc(s)+'</option>'; }).join('');
    $('fYear').innerHTML = '<option value="">ทุกชั้นปี</option>' + d.years.map(function(y){ return '<option value="'+esc(y)+'">ปี '+esc(y)+'</option>'; }).join('');
    $('cYear').innerHTML = d.years.map(function(y){ return '<option value="'+esc(y)+'"'+(y==='5'?' selected':'')+'>ปี '+esc(y)+'</option>'; }).join('');
    var ay = acadYear(d.today), y0 = (+ay-543)+'-04-01'; $('tFrom').value = y0 > d.today ? (+ay-544)+'-04-01' : y0; $('tTo').value = d.today;
    search();
  }).catch(function(e){ if (relogin(e, start)) return; $('login').classList.remove('hidden'); $('loginMsg').textContent = e.message; });
}

/* ---------- แท็บหลัก ---------- */
var VIEW = 'person', LOADED = {};
[].forEach.call(document.querySelectorAll('nav.tabs button'), function(b){ b.onclick = function(){ showView(b.dataset.v); }; });
function showView(v){
  if (v !== 'person') psyLock();
  VIEW = v;
  [].forEach.call(document.querySelectorAll('nav.tabs button'), function(b){ b.setAttribute('aria-selected', String(b.dataset.v === v)); });
  ['person','cohort','teach'].forEach(function(k){ $('v-'+k).classList.toggle('hidden', k !== v); });
  if (v === 'cohort' && !LOADED.cohort) loadCohort();
  if (v === 'teach' && !LOADED.teach) loadTeach();
}

/* ---------- ค้นหา ---------- */
var sTimer = null;
$('q').oninput = function(){ clearTimeout(sTimer); sTimer = setTimeout(search, 300); };
$('fStatus').onchange = search; $('fYear').onchange = search;
function search(){
  var q = $('q').value.trim(); $('resCount').textContent = 'กำลังค้นหา...';
  api('adm_search', { q:q, status:$('fStatus').value, year:$('fYear').value }).then(function(r){
    $('resCount').textContent = r.total ? 'พบ ' + r.total + ' คน' + (r.total > r.rows.length ? ' (แสดง ' + r.rows.length + ' คนแรก พิมพ์เพิ่มเพื่อกรอง)' : '') : 'ไม่พบนักเรียนตามเงื่อนไข';
    $('results').innerHTML = r.rows.map(function(s){
      return '<li><button data-id="'+esc(s.id)+'" aria-current="'+(s.id===CUR)+'"><b>'+esc(s.name)+'</b><small>'+esc(s.id)+' · ปี '+esc(s.year)+(s.group?' · กลุ่ม '+esc(s.group):'')+
        (s.status!=='กำลังศึกษา'?' · <span class="pill warn">'+esc(s.status)+'</span>':'')+'</small></button></li>'; }).join('');
    [].forEach.call(document.querySelectorAll('#results button'), function(b){ b.onclick = function(){ openStudent(b.dataset.id); }; });
  }).catch(function(e){ if (relogin(e, search)) return; $('resCount').textContent = e.message; });
}

/* ---------- รายบุคคล ---------- */
function openStudent(id, keepSub){
  if (id !== CUR) psyLock();
  CUR = id; if (!keepSub) { SUB = 'eval'; SHOWREPL = false; }
  [].forEach.call(document.querySelectorAll('#results button'), function(b){ b.setAttribute('aria-current', String(b.dataset.id === id)); });
  $('personEmpty').classList.remove('hidden'); $('personEmpty').textContent = 'กำลังโหลดประวัติ...'; $('personBody').classList.add('hidden');
  api('adm_student', { id:id }).then(function(b){ if (CUR !== id) return; B = b; renderPerson();
    if (window.innerWidth < 900) $('person').scrollIntoView({behavior:'smooth'}); })
    .catch(function(e){ if (relogin(e, function(){ openStudent(id, keepSub); })) return; $('personEmpty').textContent = e.message; });
}
function counts(list){ var c = {}; STAT.forEach(function(s){ c[s]=0; }); list.forEach(function(e){ if (c[e.status]!=null) c[e.status]++; }); return c; }
function renderPerson(){
  var p = B.profile, ev = B.evals.filter(function(e){ return !e.replaced; }), c = counts(ev);
  var con = ev.filter(function(e){ return CONCERN[e.status]; }), cd = {}; con.forEach(function(e){ cd[e.department]=1; });
  var af = (B.affective||[]).slice().sort(function(a,b){ return a.acad_year < b.acad_year ? 1 : -1; })[0];
  var rv = (B.reviews||[])[0];
  var tiles = [
    [ev.length, 'บันทึก', 'ผลประเมินทั้งหมด'],
    [con.length, 'บันทึก', 'มีข้อกังวล (●▲■)'],

    '<div class="panel"><h3>รอบทบทวนของชั้นปีนี้</h3>'+(rounds.length ? '<div class="tablewrap"><table><thead><tr><th>รอบ</th><th>ช่วงข้อมูล</th><th>วันประชุม</th><th>สถานะ</th></tr></thead><tbody>'+
      rounds.map(function(r){ return '<tr><td>'+esc(r.id)+'</td><td>'+thd(r.start)+' – '+thd(r.end)+'</td><td>'+(r.meeting?thd(r.meeting):'<span class="hint">—</span>')+'</td><td>'+esc(r.status)+'</td></tr>'; }).join('')+'</tbody></table></div>' : '<div class="hint">ยังไม่มีรอบทบทวน</div>')+'</div>'+
    '<div class="panel"><h3>นักเรียนที่มีข้อกังวล ('+watch.length+' คน)</h3>'+(watch.length ? '<div class="tablewrap"><table><thead><tr><th>นักเรียน</th><th class="num">ข้อกังวล (บันทึก)</th><th class="num">▲■ (บันทึก)</th><th class="num">จากภาควิชา</th><th>ทบทวนล่าสุด</th><th>วันนัดตามแผน</th></tr></thead><tbody>'+
      watch.map(function(x){ var r = x.rv; return '<tr><td><a class="lnk" data-open="'+esc(x.id)+'">'+esc(x.name)+'</a><div class="hint">'+esc(x.id)+'</div></td><td class="num">'+x.con+' / '+x.n+'</td><td class="num">'+x.sev+'</td><td class="num">'+x.depts+' ภาค</td>'+
        '<td>'+(r ? esc(r[1])+'<div class="hint">'+esc([r[2],r[3],r[4]].filter(Boolean).join(' · '))+'</div>'+(r[7]?'<div><b>'+esc(r[7])+'</b></div>':'') : '<span class="hint">—</span>')+'</td><td>'+(r&&r[5]?thd(r[5]):'<span class="hint">—</span>')+'</td></tr>'; }).join('')+
      '</tbody></table></div>' : '<div class="hint">ไม่มีนักเรียนที่มีข้อกังวล</div>')+'<div class="note">"วันนัดตามแผน" คือวันที่กำหนดไว้ในแผน ระบบไม่สรุปว่างานเสร็จหรือค้าง</div></div>';
  var ev = all.map(function(e){ return { week_start:e.week, status:e.status }; }), saveB = B; B = { today: d.today }; trendChart($('cTrend'), ev); B = saveB;
  [].forEach.call(document.querySelectorAll('[data-open]'), function(a){ a.onclick = function(){ showView('person'); openStudent(a.dataset.open); }; });
}

/* ---------- การมีส่วนร่วมของอาจารย์ ---------- */
$('tGo').onclick = loadTeach;
function loadTeach(){
  LOADED.teach = true; $('teachBody').innerHTML = '<div class="panel empty">กำลังโหลด...</div>';
  api('adm_teachers', { from: $('tFrom').value, to: $('tTo').value }).then(function(d){
    $('teachBody').innerHTML =
      '<div class="panel"><h3>การส่งรายอาจารย์ ('+d.teachers.length+' คน)</h3>'+(d.teachers.length ? '<div class="tablewrap"><table><thead><tr><th>อาจารย์</th><th>ภาควิชาที่ส่ง</th><th class="num">ครั้งที่ส่ง</th><th class="num">บันทึก</th><th class="num">นักเรียน (คน)</th><th class="num">ข้อกังวล (บันทึก)</th><th>ส่งล่าสุด</th></tr></thead><tbody>'+
        d.teachers.map(function(t){ return '<tr><td>'+(t.name?esc(t.name)+'<div class="hint">'+esc(t.email)+'</div>':esc(t.email))+'</td><td>'+t.depts.map(function(x){ return esc(short(x)); }).join(', ')+'</td>'+
          '<td class="num">'+t.submissions+'</td><td class="num">'+t.records+'</td><td class="num">'+t.students+'</td><td class="num">'+t.concerns+'</td><td>'+thd(t.last)+'</td></tr>'; }).join('')+'</tbody></table></div>' : '<div class="hint">ไม่มีการส่งในช่วงนี้</div>')+
        '<div class="note">ครั้งที่ส่ง = ภาควิชา × สัปดาห์ · บันทึก = ผลประเมินรายคน (ไม่นับที่แทนที่แล้ว) · นักเรียน = จำนวนคนไม่ซ้ำ</div></div>'+
      '<div class="panel"><h3>การส่งครบรายภาควิชา</h3>'+(d.depts.length ? '<div class="tablewrap"><table><thead><tr><th>ภาควิชา</th><th class="num">ต้องประเมิน</th><th class="num">ประเมินแล้ว</th><th class="num">ส่งครบ</th><th></th></tr></thead><tbody>'+
        d.depts.map(function(x){ return '<tr><td>'+esc(short(x.dept))+'</td><td class="num">'+x.due+'</td><td class="num">'+x.done+'</td><td class="num">'+(x.pct==null?'—':x.pct+'%')+'</td><td><div class="meter"><span style="width:'+(x.pct||0)+'%"></span></div></td></tr>'; }).join('')+'</tbody></table></div>'
        : '<div class="nosrc">ยังไม่มีฐานคำนวณในช่วงนี้ (ไม่มี rotation ที่สิ้นสุดแล้วในตารางหมุนเวียน) จึงไม่แสดงเปอร์เซ็นต์</div>')+
        '<div class="note">ฐาน = นักเรียน 1 คน × 1 rotation ที่สิ้นสุดแล้วในช่วงที่เลือก (หน่วย: คน-rotation) · นับว่าประเมินแล้วเมื่อมีผลประเมินจากภาควิชานั้นระหว่างช่วง rotation ถึง 2 สัปดาห์หลังสิ้นสุด</div></div>';
  }).catch(function(e){ if (relogin(e, loadTeach)) return; $('teachBody').innerHTML = '<div class="panel empty">'+esc(e.message)+'</div>'; });
}
